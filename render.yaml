services:
  - type: web
    name: deepseek-telegram-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DEEPSEEK_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WHISPER_SIZE
        value: small
      - key: ENABLE_HEALTH
        value: "1"
      - key: CONCURRENCY
        value: "8"
      - key: RATE_LIMIT
        value: "20"
      # YouTube blocks cloud IPs — set these in the Render dashboard if
      # URL/YouTube summaries fail with "YouTube is blocking requests".
      # YT_PROXY:    proxy whose exit IP is not a cloud IP (best fix)
      # YT_COOKIES:  cookies.txt (path / raw content / base64) for yt-dlp
      - key: YT_PROXY
        sync: false
      - key: YT_COOKIES
        sync: false
    autoDeploy: true
    healthCheckPath: /health
